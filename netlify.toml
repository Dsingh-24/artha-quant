"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  command = "sh scripts/build_netlify.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@google/genai", "@netlify/database", "pg"]
  included_files = ["netlify/functions/data/stock_ai_context.json"]

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/static/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[redirects]]
  from = "/api/auth/*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
